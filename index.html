<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音声入力 単体テスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202124;font:17px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:560px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid #dadce0;border-radius:18px;padding:18px}h1{font-size:22px;margin:0 0 10px}.status{min-height:52px;padding:12px;border-radius:12px;background:#eef3fd;margin:12px 0;white-space:pre-wrap}.mic{display:block;width:112px;height:112px;border-radius:56px;border:0;background:#1a73e8;color:#fff;font-size:44px;margin:22px auto}.mic.recording{background:#b3261e}button{font:inherit;min-height:48px;padding:10px 14px;border:1px solid #c8ccd0;border-radius:12px;background:#fff;color:#174ea6}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.muted{color:#6b7280;font-size:14px}.ok{color:#137333}.bad{color:#b3261e}</style>
</head>
<body><main><div class="card">
<h1>音声入力 単体テスト</h1>
<p class="muted">GASとは切り離して、iPhoneのマイク取得だけを確認します。録音データはこのページ内だけに保持し、どこにも送信しません。</p>
<div id="status" class="status">マイクボタンを押してください。</div>
<button id="mic" class="mic" type="button" aria-label="録音開始">🎙</button>
<div class="actions"><button id="play" type="button" disabled>録音を再生</button><button id="reset" type="button">やり直す</button></div>
<audio id="audio" controls hidden></audio>
<p id="detail" class="muted"></p>
</div></main>
<script>
'use strict';
const statusEl=document.getElementById('status'),mic=document.getElementById('mic'),play=document.getElementById('play'),reset=document.getElementById('reset'),audio=document.getElementById('audio'),detail=document.getElementById('detail');
let stream=null,recorder=null,chunks=[],blobUrl='';
function say(text,kind=''){statusEl.textContent=text;statusEl.className='status '+kind;}
function cleanupStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function resetAll(){if(recorder&&recorder.state==='recording')recorder.stop();cleanupStream();chunks=[];if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl='';audio.removeAttribute('src');audio.hidden=true;play.disabled=true;mic.classList.remove('recording');mic.textContent='🎙';mic.setAttribute('aria-label','録音開始');say('マイクボタンを押してください。');detail.textContent='';}
async function startRecording(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('この環境ではマイク取得を利用できません。HTTPSで開いているか確認してください。','bad');return;}
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
  chunks=[];recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{const type=recorder.mimeType||'audio/webm';const blob=new Blob(chunks,{type});if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(blob);audio.src=blobUrl;audio.hidden=false;play.disabled=false;cleanupStream();mic.classList.remove('recording');mic.textContent='🎙';mic.setAttribute('aria-label','録音開始');say('録音できました。再生して音声を確認してください。','ok');detail.textContent='形式: '+type+' / '+Math.round(blob.size/1024)+' KB';};
  recorder.start();mic.classList.add('recording');mic.textContent='■';mic.setAttribute('aria-label','録音停止');say('録音中です。もう一度押すと停止します。');
 }catch(e){cleanupStream();say('マイクを開始できませんでした: '+(e.name||'Error')+'\nSafariのマイク権限も確認してください。','bad');detail.textContent=String(e&&e.message||e);}
}
mic.onclick=()=>{if(recorder&&recorder.state==='recording'){recorder.stop();return;}startRecording();};
play.onclick=()=>{if(blobUrl)audio.play();};
reset.onclick=resetAll;
window.addEventListener('pagehide',cleanupStream);
</script>
</body></html>
